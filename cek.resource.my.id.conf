# ============================================================
# Apache VirtualHost Configuration — cek.resource.my.id
#
# Untuk Laragon: salin ke C:\laragon\etc\apache2\sites-enabled\
# Nama file: cek.resource.my.id.conf
#
# Untuk Apache di Linux: salin ke /etc/apache2/sites-available/
# Lalu jalankan: sudo a2ensite cek.resource.my.id && sudo systemctl reload apache2
# ============================================================

<VirtualHost *:80>
    ServerName   cek.resource.my.id
    ServerAlias  www.cek.resource.my.id
    DocumentRoot "E:/web/cek.resource.my.id"

    # PENTING: Nonaktifkan redirect trailing slash
    # Ini mencegah 301 yang mengubah POST menjadi GET
    DirectorySlash Off

    <Directory "E:/web/cek.resource.my.id">
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted

        # Izinkan Authorization header diteruskan ke PHP
        CGIPassAuth On
    </Directory>

    # Log
    ErrorLog  "E:/laragon/log/apache2/cek.resource.my.id-error.log"
    CustomLog "E:/laragon/log/apache2/cek.resource.my.id-access.log" combined
</VirtualHost>

