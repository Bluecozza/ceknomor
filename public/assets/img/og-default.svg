<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100"  r="180" fill="#e63946" opacity="0.06"/>
  <circle cx="150"  cy="530"  r="220" fill="#3b82f6" opacity="0.05"/>
  <circle cx="600"  cy="315"  r="350" fill="#ffffff"  opacity="0.02"/>

  <!-- Grid lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#334155" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#334155" stroke-width="1"/>

  <!-- Shield icon -->
  <g transform="translate(490, 160)">
    <path d="M110 10 L210 50 L210 130 Q210 200 110 240 Q10 200 10 130 L10 50 Z"
          fill="none" stroke="#e63946" stroke-width="6" opacity="0.8"/>
    <path d="M75 130 L100 155 L145 105"
          fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="435" font-family="Arial,sans-serif" font-size="52" font-weight="700"
        text-anchor="middle" fill="#ffffff">
    <tspan fill="#e63946">cek</tspan>.resource.my.id
  </text>

  <!-- Tagline -->
  <text x="600" y="495" font-family="Arial,sans-serif" font-size="24"
        text-anchor="middle" fill="#94a3b8">
    Platform Laporan Penipuan &amp; Data Bermasalah Indonesia
  </text>

  <!-- Bottom badge -->
  <rect x="490" y="540" width="220" height="44" rx="22" fill="#e63946" opacity="0.15"/>
  <rect x="490" y="540" width="220" height="44" rx="22" fill="none" stroke="#e63946" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="568" font-family="Arial,sans-serif" font-size="16" font-weight="600"
        text-anchor="middle" fill="#f87171">
    Cek Sebelum Terlambat
  </text>
</svg>
